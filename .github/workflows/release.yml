name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-alpha)'
        required: true
        default: 'v0.1.0-alpha'
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Locate built jar
        id: findjar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n 1)
          echo "Found jar: $JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: LambdaMC ${{ github.event.inputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.findjar.outputs.jar }}
